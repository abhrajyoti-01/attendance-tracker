name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Lint
        run: ruff check src scripts tests
      - name: Format check
        run: ruff format --check src scripts tests

  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-value-that-is-at-least-32-characters
      RATE_LIMIT_ENABLED: "false"
      # Quoted: an unquoted colon in this value makes the workflow unparseable.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests -m "not ml" --cov=src --cov-report=term-missing --cov-fail-under=0

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, dashboard]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deployment/Dockerfile.api -t attendance/api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f deployment/Dockerfile.worker -t attendance/worker:${{ github.sha }} .
      - name: Build dashboard image
        run: docker build -f deployment/Dockerfile.dashboard -t attendance/dashboard:${{ github.sha }} .
