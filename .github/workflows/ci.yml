name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Lint
        run: ruff check src scripts
      - name: Format check
        run: ruff format --check src scripts

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deployment/Dockerfile.api -t attendance/api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f deployment/Dockerfile.worker -t attendance/worker:${{ github.sha }} .
