global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: attendance-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/alerts.yml
