name: attendance-tracker

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${DB_USER:?set DB_USER}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/attendance
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
  STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
  # Colons inside the default value must be quoted or YAML tries to parse a map.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET - generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
  ENV: ${ENV:-production}
  DEBUG: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
  MODEL_PATH: /app/models/exported/embedding_net.onnx
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
  EMAIL_BASE_URL: ${EMAIL_BASE_URL:-https://localhost}

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d attendance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-51-48Z
    container_name: attendance_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    image: attendance/api:latest
    container_name: attendance_api
    restart: unless-stopped
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${API_WORKERS:-4}
      --proxy-headers
      --forwarded-allow-ips "*"
      --timeout-keep-alive 30
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API refuses to start on a stale schema, so wait for migrations to
      # finish instead of crash-looping on a fresh `up`.
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    volumes:
      - models_data:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    image: attendance/worker:latest
    container_name: attendance_worker
    restart: unless-stopped
    command: celery -A src.workers.celery_app worker -Q default,embedding,export -c 2 --loglevel=info --max-tasks-per-child=50
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4g

  trainer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    image: attendance/worker:latest
    container_name: attendance_trainer
    restart: unless-stopped
    command: celery -A src.workers.celery_app worker -Q training -c 1 --loglevel=info
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/models
      - training_data:/app/data/faces
    profiles: ["training"]
    deploy:
      resources:
        limits:
          memory: 8g

  beat:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    image: attendance/worker:latest
    container_name: attendance_beat
    restart: unless-stopped
    command: celery -A src.workers.celery_app beat --loglevel=info
    environment:
      <<: *api-env
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dashboard
    image: attendance/dashboard:latest
    container_name: attendance_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["dashboard"]
    deploy:
      resources:
        limits:
          memory: 128m

  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    image: attendance/api:latest
    container_name: attendance_migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/attendance
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: attendance_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Default: plain HTTP, no certificates required. Enable the `tls` profile
      # (NGINX_CONF=nginx-tls.conf via COMPOSE_FILE or -e) once certs exist.
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  miniodata:
  models_data:
  training_data:
