# Shared location blocks included by both HTTP and HTTPS servers.

# Login - strictest rate limit
location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Machine endpoints (kiosks) - moderate burst tolerance
location /api/recognize {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 60s;
}

# Live attendance feed (SSE): no buffering, long-lived connections.
# Must precede the general /api/ block.
location = /api/dashboard/stream {
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# General API
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Interactive docs are served by the API itself; disable in production via
# SECURITY_DOCS_IN_PRODUCTION=false (default). Nginx simply forwards.
location ~ ^/(docs|openapi\.json)$ {
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Prometheus metrics: deny by default. Allow only trusted networks, e.g.:
#   allow 10.0.0.0/8;   allow 172.16.0.0/12;   allow 192.168.0.0/16;
location /metrics {
    deny all;
}

# Everything else redirects to the docs root.
location = / {
    return 301 /docs;
}
