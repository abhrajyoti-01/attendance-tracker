# TLS overlay: replaces nginx.conf when the `tls` compose profile is active.
#
# Requires certificates mounted at /etc/nginx/certs/{fullchain.pem,privkey.pem}
# (deployment/nginx/certs on the host). Port 80 redirects to HTTPS except for
# /healthz, which orchestrators poll without following redirects.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 10M;
    client_body_timeout 30s;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=12r/m;
    limit_req_status 429;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            proxy_pass http://api_backend/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        include /etc/nginx/snippets/api-locations.conf;
    }
}
