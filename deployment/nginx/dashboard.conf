# Dashboard SPA server: static assets + reverse proxy to the API service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for the SPA itself. The API sets its own, but they do
    # not apply to the HTML document, which was previously unprotected.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # 'unsafe-inline' is required for the Vite-injected preload/style handling;
    # tighten further if you move to nonce-based styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Long-lived live feed: never buffer, allow idle heartbeats.
    location = /api/dashboard/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Static assets are content-hashed; cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # The SPA shell must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
