worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 10M;
    client_body_timeout 30s;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Rate limiting zones (defense in depth; the app also throttles itself)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=12r/m;
    limit_req_status 429;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect once TLS certificates are provisioned.
    server {
        listen 80;
        server_name _;

        # Health probes stay on HTTP for orchestrators without certs.
        location = /healthz {
            access_log off;
            proxy_pass http://api_backend/health;
        }

        # [tls-only] Uncomment after placing certificates in ./nginx/certs:
        # return 301 https://$host$request_uri;

        include /etc/nginx/snippets/api-locations.conf;
    }

    # TLS termination. Activate by mounting fullchain.pem/privkey.pem in
    # deployment/nginx/certs and removing the [tls-only] block above.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # [tls-only] Uncomment when certificates exist:
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_stapling on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        include /etc/nginx/snippets/api-locations.conf;
    }
}
